[project]
name = "spg"
version = "0.1.0"
description = "A tiny per-project command publisher: read spg.toml, expose its commands in ~/bin."
authors = [
    { name = "Denny", email = "shr3kst3r@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich-click>=1.9",
]

[project.scripts]
spg = "spg.cli:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.37",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "TID", "PTH", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ty.src]
include = ["src"]
